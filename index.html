<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>App Anime</title>
       <link rel="stylesheet" href="style.css">
       <link rel="manifest" href="manifest.json" />

    </head>
    <body>
        <img max-width="100%" src="https://conteudo.imguol.com.br/c/entretenimento/34/2017/03/30/dragon-ball-super-1490895862584_v2_900x506.jpg" alt="Personagens de Dragon Ball.">  
        <h1>Dragon Ball</h1>
        <hr/>
        <p>Clique no Shenlong para sortear seu personagem!</p>   
        <img width="100px" class="shenlong" src="https://a.wattpad.com/useravatar/Dragonball_ShenLong.256.997320.jpg" onclick="getAnime()" alt="Imagem de Shenlong">  
        <div id="anime">    
        </div>        

       <script src="script.js"></script>
        <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, function(error) {
                    console.log('ServiceWorker registration failed: ', error);
                });
            });
        }
    </script>  
    </body>
</html>
